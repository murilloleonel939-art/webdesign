# Coolify: contexto /, archivo Compose /deploy/caddy/compose.coolify.yaml.
# Las rutas build son relativas a este archivo.
services:
  sites-permissions:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R u+rwX,go+rX /data"]
    volumes:
      - type: volume
        source: sites-data
        target: /data
        volume:
          nocopy: true
    networks:
      - coolify

  caddy:
    depends_on:
      sites-permissions:
        condition: service_completed_successfully
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - type: volume
        source: sites-data
        target: /data
        read_only: true
        volume:
          nocopy: true
      - caddy-data:/caddy-data
    networks:
      - coolify

volumes:
  caddy-data:
  # Usar el nombre Docker exacto del volumen creado en platform.
  sites-data:
    external: true
    name: ${SITES_VOLUME_NAME}

networks:
  coolify:
    external: true
    name: coolify
