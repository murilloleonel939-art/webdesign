# Coolify: contexto /, archivo Compose /deploy/caddy/compose.coolify.yaml.
# Las rutas build son relativas a este archivo.
services:
  caddy:
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - type: volume
        source: sites-data
        target: /data
        read_only: true
        volume:
          nocopy: true
      - caddy-data:/caddy-data
    networks:
      - coolify

volumes:
  caddy-data:
  # Usar el nombre Docker exacto del volumen creado en platform.
  sites-data:
    external: true
    name: ${SITES_VOLUME_NAME:?Configura el nombre del volumen compartido de platform}

networks:
  coolify:
    external: true
    name: coolify
