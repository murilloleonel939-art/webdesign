# Coolify: contexto /, archivo Compose /deploy/caddy/compose.coolify.yaml.
# Las rutas build son relativas a este archivo.
services:
  sites-permissions:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R u+rwX,go+rX /data"]
    volumes:
      - type: volume
        source: sites-data
        target: /data
        volume:
          nocopy: true
    networks:
      - coolify

  caddy:
    depends_on:
      sites-permissions:
        condition: service_completed_successfully
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - type: volume
        source: sites-data
        target: /data
        read_only: true
        volume:
          nocopy: true
      - caddy-data:/caddy-data
    networks:
      - coolify
    # Router comodin de sitios (spec 5.3). Coolify no acepta `*.dominio` en su
    # campo de dominio porque lo valida como URL, asi que el comodin se declara
    # aqui.
    #
    # `zottaweb.site` va escapado como `zottaweb\.site` y la etiqueta es UNA:
    # los hosts del pool son `<etiqueta>.zottaweb.site`. Un regex con dos
    # etiquetas no recogeria ninguno.
    #
    # Prioridad 1: los routers de Coolify usan la prioridad por longitud de
    # regla, asi que cualquier dominio exacto gana y el comodin solo recoge lo
    # que nadie mas reclama.
    #
    # Sin `entrypoints` a proposito: se ata a los que tenga Traefik sin tener
    # que acertar su nombre. `tls=true` deja que Coolify emita el certificado.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.sites-wildcard.rule=HostRegexp(`^[a-zA-Z0-9-]+\\.zottaweb\\.site$`)"
      - "traefik.http.routers.sites-wildcard.priority=1"
      - "traefik.http.routers.sites-wildcard.tls=true"
      - "traefik.http.routers.sites-wildcard.tls.certresolver=letsencrypt"
      - "traefik.http.services.sites-wildcard.loadbalancer.server.port=80"

volumes:
  caddy-data:
  # Usar el nombre Docker exacto del volumen creado en platform.
  sites-data:
    external: true
    name: ${SITES_VOLUME_NAME}

networks:
  coolify:
    external: true
    name: coolify
