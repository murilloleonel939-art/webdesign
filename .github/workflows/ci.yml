name: CI
on:
  push:
    branches: [main, staging]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DB_TEST_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      DB_TEST_CONFIRM: destroy-test-db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Calidad del HTML publicado (aceptacion de Fase 1): validez y accesibilidad critica.
      - run: pnpm --filter @webdesign/quality test
      - run: pnpm i18n:check
